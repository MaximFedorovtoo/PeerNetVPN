plugins { id 'application' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
application { mainClass = 'org.uzel.desktop.DesktopMain' }
sourceSets.main.resources {
    srcDir '../app/src/main/assets'
    srcDir '../app/src/main/res/values'
    srcDir '../tools'
    include 'bootstrap_config.xml'
    include 'world-countries-110m.bin'
    include 'org/uzel/desktop/routing/*.ps1'
    include 'setup-windows-routing.ps1'
}
dependencies {
    implementation project(':core')
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation('dev.onvoid.webrtc:webrtc-java:0.20.0') { transitive = false }
    runtimeOnly('dev.onvoid.webrtc:webrtc-java:0.20.0:windows-x86_64') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}
test { testLogging { events 'passed', 'failed' } }
tasks.register('packageIcon', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.uzel.desktop.PackageIcon'
    args layout.buildDirectory.file('uzelio.ico').get().asFile.absolutePath
}
tasks.register('packageInput', Copy) {
    dependsOn jar, 'packageIcon'
    into layout.buildDirectory.dir('package-input')
    from tasks.jar
    from configurations.runtimeClasspath
    from rootProject.file('THIRD_PARTY_NOTICES.txt')
}
