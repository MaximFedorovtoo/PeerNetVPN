plugins { id 'com.android.application' }
android {
    namespace 'org.uzel.probe.direct'
    compileSdk 35
    defaultConfig {
        applicationId 'org.uzel.probe.direct'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0-test'
    }
    sourceSets { main.java.srcDirs = ['../routing-probe-vpn/src/main/java'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
